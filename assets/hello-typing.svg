<svg xmlns="http://www.w3.org/2000/svg" width="700" height="70" viewBox="0 0 700 70">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');

    text {
      font-family: 'Press Start 2P', monospace;
      font-size: 28px;
      fill: #36BCF7;
    }
    .caret { fill: #36BCF7; }

    .l1 { animation: clip1 18.8s linear infinite; }
    .l2 { animation: clip2 18.8s linear infinite; }
    .l3 { animation: clip3 18.8s linear infinite; }

    /* "Hello, there!" — 13 символов */
    @keyframes clip1 {
      0%, 3.19%    { clip-path: inset(-12px 208px -12px 0); }
      3.19%        { clip-path: inset(-12px 208px -12px 0); animation-timing-function: steps(13, end); }
      13.56%       { clip-path: inset(-12px 0 -12px 0); }
      22.07%       { clip-path: inset(-12px 0 -12px 0); animation-timing-function: steps(13, end); }
      28.30%, 100% { clip-path: inset(-12px 208px -12px 0); }
    }
    /* "My name is Ilnar" — 16 символов */
    @keyframes clip2 {
      0%, 30.96%   { clip-path: inset(-12px 256px -12px 0); }
      30.96%       { clip-path: inset(-12px 256px -12px 0); animation-timing-function: steps(16, end); }
      43.72%       { clip-path: inset(-12px 0 -12px 0); }
      52.23%       { clip-path: inset(-12px 0 -12px 0); animation-timing-function: steps(16, end); }
      59.89%, 100% { clip-path: inset(-12px 256px -12px 0); }
    }
    /* "Nice to meet you!" — 17 символов */
    @keyframes clip3 {
      0%, 62.55%   { clip-path: inset(-12px 272px -12px 0); }
      62.55%       { clip-path: inset(-12px 272px -12px 0); animation-timing-function: steps(17, end); }
      76.12%       { clip-path: inset(-12px 0 -12px 0); }
      89.41%       { clip-path: inset(-12px 0 -12px 0); animation-timing-function: steps(17, end); }
      97.55%, 100% { clip-path: inset(-12px 272px -12px 0); }
    }

    /* движение курсора */
    .c1 { animation: cur1 18.8s linear infinite; }
    .c2 { animation: cur2 18.8s linear infinite; }
    .c3 { animation: cur3 18.8s linear infinite; }

    @keyframes cur1 {
      0%, 3.19%    { transform: translateX(0); }
      3.19%        { transform: translateX(0); animation-timing-function: steps(13, end); }
      13.56%       { transform: translateX(208px); }
      22.07%       { transform: translateX(208px); animation-timing-function: steps(13, end); }
      28.30%, 100% { transform: translateX(0); }
    }
    @keyframes cur2 {
      0%, 30.96%   { transform: translateX(0); }
      30.96%       { transform: translateX(0); animation-timing-function: steps(16, end); }
      43.72%       { transform: translateX(256px); }
      52.23%       { transform: translateX(256px); animation-timing-function: steps(16, end); }
      59.89%, 100% { transform: translateX(0); }
    }
    @keyframes cur3 {
      0%, 62.55%   { transform: translateX(0); }
      62.55%       { transform: translateX(0); animation-timing-function: steps(17, end); }
      76.12%       { transform: translateX(272px); }
      89.41%       { transform: translateX(272px); animation-timing-function: steps(17, end); }
      97.55%, 100% { transform: translateX(0); }
    }

    /* видимость курсора в своей фазе */
    .v1 { animation: vis1 18.8s linear infinite; }
    .v2 { animation: vis2 18.8s linear infinite; }
    .v3 { animation: vis3 18.8s linear infinite; }
    @keyframes vis1 { 0%,3.19% {opacity:0} 3.2%,28.30% {opacity:1} 28.31%,100% {opacity:0} }
    @keyframes vis2 { 0%,30.96%{opacity:0} 30.97%,59.89%{opacity:1} 59.9%,100%{opacity:0} }
    @keyframes vis3 { 0%,62.55%{opacity:0} 62.56%,97.55%{opacity:1} 97.56%,100%{opacity:0} }

    /* мигание */
    .blink { animation: blink 1s linear infinite; }
    @keyframes blink { 0%,55% {opacity:1} 56%,100% {opacity:0} }
  </style>

  <!-- строки по центру, ширина зафиксирована textLength -->
  <text class="l1" x="350" y="45" text-anchor="middle" textLength="208" lengthAdjust="spacingAndGlyphs">Hello, there!</text>
  <text class="l2" x="350" y="45" text-anchor="middle" textLength="256" lengthAdjust="spacingAndGlyphs">My name is Ilnar</text>
  <text class="l3" x="350" y="45" text-anchor="middle" textLength="272" lengthAdjust="spacingAndGlyphs">Nice to meet you!</text>

  <!-- тонкий курсор-каретка -->
  <g class="v1"><g class="blink"><rect class="caret c1" x="246" y="25" width="3" height="24"/></g></g>
  <g class="v2"><g class="blink"><rect class="caret c2" x="222" y="25" width="3" height="24"/></g></g>
  <g class="v3"><g class="blink"><rect class="caret c3" x="214" y="25" width="3" height="24"/></g></g>
</svg>
